# Golden set v1. DRAFT by the agent, labels to be reviewed by Riadh (status below).
# qrels grade: 2 = answers the question, 1 = related/useful. Keys are language-independent article keys.
# scope = jurisdictions the caller is entitled to (server-side filter).
version: 1
status: draft-needs-human-review
queries:
