name: verify
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, tests, docs (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run scripts/verify.py

  retrieval-gate:
    name: Offline retrieval regression gate
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEXGRID_DB: sqlite:///var/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Ingest pinned corpus
        run: mkdir -p var && uv run lexgrid ingest | tail -1
      - name: Evaluate golden set (in-memory BM25, hash embedder, overlap reranker)
        run: uv run lexgrid eval --backend memory --embedder hash --reranker overlap --run-id CI-OFFLINE --out-dir ci-results
      - name: Compare with committed baseline
        run: uv run python scripts/eval_gate.py --results ci-results/CI-OFFLINE.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-eval
          path: ci-results/

  api-contract:
    name: API contract (promptfoo, offline server)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEXGRID_DB: sqlite:///var/ci.db
      LEXGRID_BACKEND: memory
      LEXGRID_EMBEDDER: hash
      LEXGRID_RERANKER: overlap
      LEXGRID_API_KEYS: "dev-fr:FR;dev-all:EU,FR,DE"
      LEXGRID_URL: http://127.0.0.1:8000
      PROMPTFOO_PYTHON: python3
      PROMPTFOO_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - name: Ingest pinned corpus
        run: mkdir -p var && uv run lexgrid ingest | tail -1
      - name: Start API (in-memory backend, offline models)
        run: |
          nohup uv run lexgrid serve --port 8000 > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf "$LEXGRID_URL/health" && break; sleep 2; done
          curl -sf "$LEXGRID_URL/health"
      - name: promptfoo contract suite
        run: npx -y promptfoo@0.126.0 eval -c evals/promptfoo/promptfooconfig.contract.yaml --no-cache --no-share -o promptfoo-contract.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promptfoo-contract
          path: |
            promptfoo-contract.json
            serve.log
