[project]
name = "lexgrid"
version = "0.1.0"
description = "Lab: multi-jurisdiction legal retrieval (ingestion, versioned hybrid indexes, evaluation). Not legal advice."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "lxml>=5.2",
    "beautifulsoup4>=4.12",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "numpy>=1.26",
    "opensearch-py>=2.6",
    "boto3>=1.35",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.2",
]

[project.optional-dependencies]
# Local models (torch). Not installed in CI: `uv sync --extra ml` on the Mac.
ml = ["sentence-transformers>=3.0"]

[project.scripts]
lexgrid = "lexgrid.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexgrid"]
artifacts = ["src/lexgrid/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # legal texts contain typographic quotes/dashes

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
sqlite_cache = false

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*", "opensearchpy", "opensearchpy.*", "boto3", "botocore.*", "sentence_transformers", "torch"]
ignore_missing_imports = true
